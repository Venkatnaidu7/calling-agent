name: Continuous Integration & Deployment

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Backend Tests & Linting
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ai_voice_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/ai_voice_platform_test
          REDIS_URL: redis://localhost:6379/0
          APP_SECRET_KEY: test-secret-key-1234567890
          JWT_SECRET_KEY: test-jwt-secret-key-1234567890
        run: pytest tests/ -v

  build-containers:
    name: Build Docker Containers
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API Docker Image
        run: docker build -t ai-voice-api:latest -f infrastructure/docker/api.Dockerfile .

      - name: Build Worker Docker Image
        run: docker build -t ai-voice-worker:latest -f infrastructure/docker/worker.Dockerfile .

      - name: Build Web Docker Image
        run: docker build -t ai-voice-web:latest -f infrastructure/docker/web.Dockerfile .
