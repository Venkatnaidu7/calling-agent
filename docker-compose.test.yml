version: '3.8'

services:
  postgres:
    environment:
      POSTGRES_DB: ai_voice_platform_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_test:/var/lib/postgresql/data

  redis:
    ports:
      - "6380:6379"
    volumes:
      - redis_data_test:/data

  api:
    env_file:
      - .env.test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    env_file:
      - .env.test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data_test:
  redis_data_test:
