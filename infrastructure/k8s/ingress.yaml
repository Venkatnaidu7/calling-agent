apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aicalling-ingress
  namespace: aicalling-prod
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: api-service
spec:
  tls:
    - hosts:
        - aicalling.com
        - app.aicalling.com
        - api.aicalling.com
      secretName: aicalling-tls
  rules:
    - host: app.aicalling.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-service
                port:
                  number: 3000
    - host: api.aicalling.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 8000
