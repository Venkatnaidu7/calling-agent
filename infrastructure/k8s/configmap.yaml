apiVersion: v1
kind: Namespace
metadata:
  name: aicalling-prod
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aicalling-config
  namespace: aicalling-prod
data:
  APP_ENV: "production"
  APP_PORT: "8000"
  APP_LOG_LEVEL: "INFO"
  CORS_ALLOWED_ORIGINS: "https://app.aicalling.com,https://aicalling.com"
  CALL_MAX_DURATION_SECONDS: "3600"
  CALL_MAX_CONCURRENT_PER_TENANT: "20"
